name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

# ──────────────────────────────────────────────────────────────────────────────
# Shared setup steps used by every job
# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ── v2: PyTorch (current, unchanged) ─────────────────────────────────────
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push v2 (PyTorch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: wayu199/meter-ocr:v2
          cache-from: type=gha,scope=v2
          cache-to: type=gha,mode=max,scope=v2

  # ── v3: ONNX – auto execution provider (CPU / CoreML / DirectML) ─────────
  build-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push v3 (ONNX)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.v3
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: wayu199/meter-ocr:v3
          cache-from: type=gha,scope=v3
          cache-to: type=gha,mode=max,scope=v3

  # ── v4: ONNX – CPU-only, smallest image ──────────────────────────────────
  build-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push v4 (ONNX CPU-only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.v4
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: wayu199/meter-ocr:v4
          cache-from: type=gha,scope=v4
          cache-to: type=gha,mode=max,scope=v4
